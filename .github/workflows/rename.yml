name: Auto Rename NeetCode Solutions

on:
  push:
    branches:
      - main  # 기본 브랜치명이 main이므로 맞습니다!

jobs:
  rename-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Rename submission files
        run: |
          find . -type f -name "submission-*.*" | while read file; do
            dir=$(dirname "$file")
            ext="${file##*.}"
            prob_name=$(basename "$dir")
            new_name="$dir/$prob_name.$ext"
            
            git mv "$file" "$new_name" 2>/dev/null || mv "$file" "$new_name"
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "style: auto-rename submission files to problem name"
            git push
          fi
